version: 2

updates:
  # This entry only starts GitHub's automatic dependency submission for NuGet, which the root's .slnx does not. Without
  # that submission the dependency graph reads every version in Directory.Packages.props as ">= 0", and no NuGet alert
  # fires.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
