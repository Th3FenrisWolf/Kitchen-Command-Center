name: Build and Test Solution

on:
  pull_request:
    branches: [main, replatform]
  push:
    branches: [main, replatform]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A cancel part-way through moving the main tags would leave app and SSR images from different builds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      KCC_E2E_MEMBER_USERNAME: ${{ secrets.KCC_E2E_MEMBER_USERNAME }}
      KCC_E2E_MEMBER_PASSWORD: ${{ secrets.KCC_E2E_MEMBER_PASSWORD }}

    steps:
      # ---------- Setup ----------
      - name: Checkout
        uses: actions/checkout@v7

      # The Pi updates deploy.sh itself through git pull, so a broken line, once merged, would stop it pulling the fix.
      - name: Lint the deploy scripts
        run: shellcheck -s sh deploy/smoke-test.sh deploy/deploy.sh deploy/kcc deploy/kcc-backup/kcc-backup

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # ---------- Build task 1: .NET solution (Release) ----------
      - name: Build .NET solution (Release)
        id: build_dotnet
        run: dotnet build KitchenCommandCenter.sln -c Release

      # ---------- Build task 2: frontend (attempted even if .NET build failed) ----------
      - name: Build frontend
        id: build_frontend
        if: ${{ !cancelled() }}
        run: |
          yarn install --frozen-lockfile
          yarn build:all

      # ---------- Gate: run tests only if BOTH builds succeeded ----------
      - name: Verify builds succeeded
        if: ${{ !cancelled() }}
        run: |
          echo "dotnet build:   ${{ steps.build_dotnet.outcome }}"
          echo "frontend build: ${{ steps.build_frontend.outcome }}"
          if [ "${{ steps.build_dotnet.outcome }}" != "success" ] || [ "${{ steps.build_frontend.outcome }}" != "success" ]; then
            echo "::error::A build task failed — skipping tests."
            exit 1
          fi

      # ---------- Playwright browsers (cached across runs; keyed on the Playwright version) ----------
      - name: Resolve Playwright version (cache key)
        id: playwright_version
        run: |
          version=$(grep -oiP 'Include="Microsoft\.Playwright"\s+Version="\K[^"]+' Directory.Packages.props || true)
          if [ -z "$version" ]; then
            echo "::error::Could not resolve Microsoft.Playwright version from Directory.Packages.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Microsoft.Playwright version: $version"

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}

      # Browser binaries live in the cached dir; OS-level deps do not, so install-deps still runs on a hit.
      - name: Install Playwright browsers + deps (cache miss)
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pwsh tests/KCC.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: pwsh tests/KCC.E2ETests/bin/Release/net10.0/playwright.ps1 install-deps

      # ---------- Full combined test suite ----------
      # The E2E fixture starts KCC.Web and its SSR service itself, each run on a fresh SQLite file.
      - name: Run combined test suite
        run: |
          set +e  # the summary has to be cleared even when tests fail
          node tests/scripts/run.mjs
          status=$?
          # TUnit appends its own per-project tables to the job summary, and its HTML
          # reporter adds a notice line that no setting turns off. The summary file is
          # per-step, so deleting this step's drops all of it; the combined report is
          # published from the step below instead.
          rm -f "$GITHUB_STEP_SUMMARY"
          exit $status

      # ---------- Publish report ----------
      - name: Upload combined test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: combined-test-report
          path: tests/results/
          if-no-files-found: warn

      - name: Publish combined report to job summary
        if: ${{ always() }}
        run: |
          if [ ! -f tests/results/combined-report.md ]; then
            echo "::warning::No combined-report.md was produced — skipping job summary."
            exit 0
          fi
          cat tests/results/combined-report.md >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: build-and-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    env:
      FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      KCC_IMAGE_TAG: ${{ github.sha }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # One bake builds the shared frontend stage once for both site images. Each target keeps its own cache
      # scope, because targets sharing one would overwrite each other's.
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          load: true
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max
            ssr.cache-from=type=gha,scope=ssr
            ssr.cache-to=type=gha,scope=ssr,mode=max
            backup.cache-from=type=gha,scope=backup
            backup.cache-to=type=gha,scope=backup,mode=max

      - name: Smoke-test the images
        run: deploy/smoke-test.sh

      - name: Log in to the GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push all commit tags first (slow blob uploads), then move main together: the Pi never pairs app
      # and SSR images from different builds. A re-run of an older run must leave main alone, or it would roll
      # production back.
      - name: Push the images
        if: env.PUBLISH == 'true'
        run: |
          for name in app ssr backup; do
            image="ghcr.io/th3fenriswolf/kcc-$name"
            docker push "$image:$KCC_IMAGE_TAG"
          done
          main_head=$(git ls-remote origin refs/heads/main)
          if [ "${main_head%%[[:space:]]*}" = "$GITHUB_SHA" ]; then
            for name in app ssr backup; do
              image="ghcr.io/th3fenriswolf/kcc-$name"
              docker tag "$image:$KCC_IMAGE_TAG" "$image:main"
              docker push "$image:main"
            done
          else
            echo "::notice::main is no longer at $GITHUB_SHA, so the main tags stay where they are."
          fi

      - name: Prune old app images
        if: env.PUBLISH == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: kcc-app
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old SSR images
        if: env.PUBLISH == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: kcc-ssr
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old backup images
        if: env.PUBLISH == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: kcc-backup
          package-type: container
          min-versions-to-keep: 10
