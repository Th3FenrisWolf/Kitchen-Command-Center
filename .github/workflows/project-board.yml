name: Project board

on:
  push:
  pull_request:
    types: [opened, reopened, closed]
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Each run reads the whole repository, so a queued run replaces any older queued one and nothing is lost. An issue
# event the job's filter skips, label events other than building included, takes a group of its own: skipped runs in
# the shared group would still replace a queued real run.
concurrency:
  group: ${{ github.event_name == 'issues' && !(github.event.issue.user.login == github.repository_owner && ((github.event.action != 'labeled' && github.event.action != 'unlabeled' && !contains(github.event.issue.body, '<!-- sync -->')) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'building'))) && format('project-board-skip-{0}', github.run_id) || 'project-board' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'Th3FenrisWolf/Kitchen-Command-Center' && (github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && ((github.event.action != 'labeled' && github.event.action != 'unlabeled' && !contains(github.event.issue.body, '<!-- sync -->')) || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'building'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The sync code always comes from main, so a branch that changes it cannot rewrite the live board before its
      # pull request is reviewed. Every branch is still read, through the remote refs.
      - name: Checkout every branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # A user-owned project cannot be written with the workflow's GITHUB_TOKEN, so the sync uses a classic token
      # with the project and public_repo scopes: it also creates, edits and closes the issues behind the cards.
      - name: Sync the board
        run: node tools/project-board/sync.mjs
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
