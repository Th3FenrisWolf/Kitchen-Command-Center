name: Project board

on:
  push:
  pull_request:
    types: [opened, reopened, closed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Each run reads the whole repository, so a queued run replaces any older queued one and nothing is lost.
concurrency:
  group: project-board
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'Th3FenrisWolf/Kitchen-Command-Center'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The sync code always comes from main, so a branch that changes it cannot rewrite the live board before its
      # pull request is reviewed. Every branch is still read, through the remote refs.
      - name: Checkout every branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # A user-owned project cannot be written with the workflow's GITHUB_TOKEN, so the sync uses a classic token
      # with the project and public_repo scopes: it also creates, edits and closes the issues behind the cards.
      - name: Sync the board
        run: node tools/project-board/sync.mjs
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
