<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round title</title>
<link rel="stylesheet" href="/kit.css">
<style>
  #app { display: block; min-height: 100vh; padding-bottom: 144px; }
  :root[data-reduced] *, :root[data-reduced] *::before, :root[data-reduced] *::after {
    animation-duration: .01ms !important; animation-delay: 0s !important;
    transition-duration: .01ms !important; transition-delay: 0s !important;
  }
  .pv-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 20px; padding: 12px 24px; background: var(--color-desk); box-shadow: 0 1px 0 var(--color-hair); }
  .pv-bar h1 { margin: 0; font-size: 24px; line-height: 24px; }
  .pv-bar nav { display: flex; flex-wrap: wrap; gap: 14px; margin-left: auto; }
  .pv-option { max-width: 1280px; margin: 0 auto; padding: 72px 24px 0; scroll-margin-top: 48px; }
  .pv-option > header { max-width: 72ch; margin-bottom: 36px; }
</style>
</head>
<body>
<!-- wax-defs -->
<div id="app">
  <span class="kcc-grain" aria-hidden="true"></span>

  <div class="pv-bar">
    <h1>Round title</h1>
    <div class="kcc-seg" role="group" aria-label="Ramp">
      <button type="button" aria-pressed="true" data-pv-ramp="light">Light</button>
      <button type="button" aria-pressed="false" data-pv-ramp="dark">Dark</button>
    </div>
    <button type="button" class="kcc-btn kcc-btn--ghost" aria-pressed="false" data-pv-reduce>Reduce motion</button>
    <nav aria-label="Options">
      <a class="kcc-link kcc-kick" href="#direction">Direction</a>
    </nav>
  </div>

  <section class="pv-option" id="direction">
    <header>
      <p class="kcc-kick">Option 1 · axis</p>
      <h2>Direction</h2>
      <p class="kcc-body">When this direction wins, and what it costs.</p>
    </header>
  </section>

  <span class="kcc-crayon" aria-hidden="true"></span>
</div>
<script>
  const root = document.documentElement;
  const rampButtons = document.querySelectorAll('[data-pv-ramp]');
  const setRamp = (ramp) => {
    root.setAttribute('data-theme-switching', '');
    root.dataset.theme = ramp;
    rampButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.pvRamp === ramp)));
    requestAnimationFrame(() => requestAnimationFrame(() => root.removeAttribute('data-theme-switching')));
  };
  rampButtons.forEach((button) => button.addEventListener('click', () => setRamp(button.dataset.pvRamp)));
  setRamp(new URLSearchParams(location.search).get('ramp') ?? 'light');

  const reduce = document.querySelector('[data-pv-reduce]');
  reduce.addEventListener('click', () => reduce.setAttribute('aria-pressed', String(root.toggleAttribute('data-reduced'))));
</script>
</body>
</html>
