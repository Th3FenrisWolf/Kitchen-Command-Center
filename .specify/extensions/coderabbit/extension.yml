schema_version: "1.0"

extension:
  id: coderabbit
  name: "CodeRabbit Review"
  version: "0.4.0"
  description: "Runs one CodeRabbit command-line round over the feature's diff under a machine-wide lock, and never waits on a rate limit. speckit.review.run calls it as the final round of its review loop."
  author: BizStream
  repository: https://github.com/BizStream/bizstream.ai
  license: MIT

requires:
  speckit_version: ">=0.14.4"
  tools:
    # The command reports the install line and stops when the tool is absent,
    # so a machine without it still finishes implement.
    - name: coderabbit
      required: false

provides:
  templates:
    - name: review-loop
      file: templates/review-loop.md
      description: "How a command runs a CodeRabbit round under the machine lock"
  scripts:
    - name: review-run
      file: scripts/review-run.sh
      description: "Run one CodeRabbit round under a machine-wide lock, with the cache cleared"
      runtimes:
        - bash
    - name: review-run-pwsh
      file: scripts/review-run.ps1
      description: "Run one CodeRabbit round under a machine-wide lock, with the cache cleared"
      runtimes:
        - powershell
  commands:
    - name: speckit.coderabbit.review
      file: commands/speckit.coderabbit.review.md
      description: "Run one CodeRabbit round over the feature's diff that never waits on a rate limit, called by speckit.review.run"

tags:
  - "coderabbit"
  - "review"
  - "implement"
  - "bizstream"
