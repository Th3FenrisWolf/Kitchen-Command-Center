schema_version: "1.0"

extension:
  id: qa
  name: "QA Walk"
  version: "0.7.0"
  description: "Builds a QA wizard for a feature: one stage per acceptance scenario, each opening the page to check and recording pass, fail, skip or blocked. Also audits each acceptance criterion in a browser before the walk and records a verdict with evidence. For the manual pass a developer does before hand-off."
  author: BizStream
  repository: https://github.com/BizStream/bizstream.ai
  license: MIT

requires:
  speckit_version: ">=0.14.4"

provides:
  commands:
    - name: speckit.qa.walk
      file: commands/speckit.qa.walk.md
      description: "Build the QA wizard for a feature from its acceptance scenarios"
    - name: speckit.qa.audit
      file: commands/speckit.qa.audit.md
      description: "Check each acceptance criterion in a browser before the QA walk, and record a verdict with evidence"

tags:
  - "qa"
  - "wizard"
  - "acceptance"
  - "bizstream"
