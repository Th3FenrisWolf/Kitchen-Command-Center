schema_version: "1.0"

extension:
  id: review
  name: "Review Loop"
  version: "0.7.0"
  description: "Reviews the feature's diff on the branch of an open pull request: one pass of the built-in code-review skill fixes what it finds, then the checks run."
  author: BizStream
  repository: https://github.com/BizStream/bizstream.ai
  license: MIT

requires:
  speckit_version: ">=0.14.4"

provides:
  templates:
    - name: pr-watch
      file: templates/pr-watch.md
      description: "How a session watches the pull request it opened, read by speckit.card.implement and speckit.bug.fix"

  commands:
    - name: speckit.review.run
      file: commands/speckit.review.run.md
      description: "Review the feature's diff with one pass of the built-in code-review skill, then run the checks"

tags:
  - "review"
  - "implement"
  - "bizstream"
