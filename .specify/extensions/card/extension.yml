schema_version: "1.0"

extension:
  id: card
  name: "Implement Card"
  version: "0.8.0"
  description: "Takes one card from a written tasks.md to an open pull request: branch from trunk, run speckit.implement from the bizstream-implement preset, then commit, push, open the pull request, post the Jira verdict and move the card. Never merges."
  author: BizStream
  repository: https://github.com/BizStream/bizstream.ai
  license: MIT

requires:
  speckit_version: ">=0.14.4"
  tools:
    - name: git
      required: true
    - name: gh
      required: true

provides:
  templates:
    - name: code-repo
      file: templates/code-repo.md
      description: "The code repo, trunk, GitHub repo and docs-only rules speckit.implement and speckit.card.implement share"

  commands:
    - name: speckit.card.implement
      file: commands/speckit.card.implement.md
      description: "Branch, run speckit.implement, then open the pull request and move the card. Never merges."

  config:
    - name: "card-config.yml"
      template: "config-template.yml"
      description: "Repo split, content-type chain, final CodeRabbit review round, and board close-out values, read by speckit.card.implement, speckit.implement and speckit.review.run"
      required: false

tags:
  - "implement"
  - "gates"
  - "close-out"
  - "bizstream"
