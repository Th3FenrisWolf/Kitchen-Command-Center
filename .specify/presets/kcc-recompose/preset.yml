schema_version: "1.0"

preset:
  id: "kcc-recompose"
  name: "Recompose Before the Pull Request"
  version: "0.1.0"
  description: "Wraps card implement and the autopilot flow so that each branch is recomposed into clean commits once, after the review loop and before its pull request opens."
  author: "Th3FenrisWolf"
  repository: "https://github.com/Th3FenrisWolf/Kitchen-Command-Center"

requires:
  speckit_version: ">=0.16.0"

provides:
  templates:
    - type: "command"
      name: "speckit.card.implement"
      file: "commands/speckit.card.implement.md"
      description: "Recompose the branch before the close-out publishes it"
      strategy: "wrap"

    - type: "command"
      name: "speckit.flow.run"
      file: "commands/speckit.flow.run.md"
      description: "Keep the recomposition inside the autopilot's close-out"
      strategy: "wrap"

tags:
  - "git"
  - "pull-request"
