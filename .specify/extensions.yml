installed:
- assess
- batch
- bug
- card
- flow
- grill
- jira
- preview
- qa
- review
settings:
  auto_execute_hooks: true
hooks:
  after_clarify:
  - extension: preview
    command: speckit.preview.run
    enabled: true
    optional: true
    priority: 10
    prompt: Preview the look before /speckit-plan?
    description: Show the look of the spec's surfaces before the plan fixes it
    condition: null
  after_plan:
  - extension: preview
    command: speckit.preview.run
    enabled: true
    optional: true
    priority: 10
    prompt: Preview the architecture before /speckit-tasks?
    description: Show how the plan's parts fit before the tasks fix them
    condition: null
